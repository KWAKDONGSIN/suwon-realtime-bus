<!doctype html>
<!-- 시연 화면: 왼쪽 위치 보내는 쪽(A안/B안), 오른쪽 학생 화면을 나란히 보고 시연 시계를 다룬다 -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>수원대 실시간버스 시제품</title><link rel="icon" href="assets/usw-emblem.png"><link rel="stylesheet" href="style.css">
<style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}iframe{width:100%;height:760px;border:1px solid #cbd5e1;border-radius:14px;background:#fff}
@media(max-width:820px){.grid{grid-template-columns:1fr}iframe{height:640px}}</style></head>
<body>
<div class="top"><div class="brand"><img class="logo" src="assets/usw-logo.png" alt="수원대학교" onerror="this.remove()"><span class="sep"></span><div><h1>수원대 실시간버스 시제품 (A안·B안)</h1><p>왼쪽에서 위치를 보내면 오른쪽 학생 화면이 바뀝니다 · 더미 데이터</p></div></div></div>
<div class="wrap" style="max-width:none">
  <div class="card ctl">
    <b>보내는 쪽</b>
    <button class="small-btn" onclick="src('a.html')">A안 · 버스 공기계</button>
    <button class="small-btn" onclick="src('b.html')">B안 · 운행 시스템 연동</button>
    <span style="width:16px"></span><b>시연 시계</b> <span id="clk"></span>
    <button class="small-btn" onclick="Loc.Clock.reset(7*3600+35*60, speed())">07:35로 되돌리기</button>
    배속 <select id="sp" onchange="Loc.Clock.setSpeed(speed())"><option>1</option><option selected>10</option><option>30</option></select>
    <button class="small-btn" onclick="Loc.Store.clear(); Loc.Events.clear()">위치 기록 지우기</button>
  </div>
</div>
<div class="grid"><iframe id="left" src="a.html" title="보내는 쪽"></iframe><iframe src="student.html" title="학생 화면"></iframe></div>
<script src="eta.js"></script><script src="common.js"></script>
<script>
function src(u) { document.getElementById('left').src = u; }
function speed() { return +document.getElementById('sp').value; }
setInterval(function () { document.getElementById('clk').textContent = Eta.clock(Loc.Clock.now()); }, 500);
</script></body></html>
